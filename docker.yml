services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-secret}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
